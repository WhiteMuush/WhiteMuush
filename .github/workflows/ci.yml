name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main keeps its own run; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # Plain git instead of actions/checkout: no third-party code and nothing to keep up to date.
      # The repo is public, so the fetch needs no credentials. For a PR, GITHUB_SHA is the merge commit.
      - name: Fetch the commit under test
        run: |
          git -c init.defaultBranch=main init --quiet .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth 1 --no-tags origin "${GITHUB_SHA}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      # Catches a badly named image or a README banner pointing to a missing image before merge.
      - name: Validate banner setup
        run: python3 scripts/set_banner.py
