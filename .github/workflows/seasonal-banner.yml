name: Seasonal banner

on:
  schedule:
    # 00:17 UTC is already the new day in Europe/Paris; an odd minute dodges the top-of-hour queue.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: seasonal-banner
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      changed: ${{ steps.banner.outputs.changed }}
      day: ${{ steps.banner.outputs.day }}
    steps:
      # Plain git instead of actions/checkout: no third-party code and nothing to keep up to date.
      # The repo is public, so the fetch needs no credentials.
      - name: Fetch the triggering commit
        run: |
          git -c init.defaultBranch=main init --quiet .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth 1 --no-tags origin "${GITHUB_SHA}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Select today's banner
        id: banner
        run: |
          # Fix the day once so both jobs agree, whenever update ends up running.
          day="$(TZ=Europe/Paris date +%F)"
          banner="$(python3 scripts/update_banner.py --date "${day}")"
          if git diff --quiet -- README.md; then changed=false; else changed=true; fi
          {
            echo "day=${day}"
            echo "changed=${changed}"
          } >> "$GITHUB_OUTPUT"
          echo "Banner for ${day}: \`${banner}\` (README changed: ${changed})" >> "$GITHUB_STEP_SUMMARY"

  # Only this job sees the deploy key, and only when the README actually has to change.
  update:
    name: update
    needs: check
    if: needs.check.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The environment only lets main read the deploy key.
    environment: seasonal-banner
    permissions: {}
    env:
      DAY: ${{ needs.check.outputs.day }}
    steps:
      # The deploy key is the only actor allowed to push past the main ruleset.
      # It lives in a temp file for this single step and is removed on exit.
      - name: Commit and push the new banner
        env:
          DEPLOY_KEY: ${{ secrets.BANNER_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          key="${RUNNER_TEMP}/deploy_key"
          known_hosts="${RUNNER_TEMP}/known_hosts"
          trap 'rm -f "${key}"' EXIT
          (umask 077 && printf '%s\n' "${DEPLOY_KEY}" > "${key}")
          # GitHub's SSH host keys come from its API over HTTPS, so the SSH server is verified.
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "${known_hosts}"
          export GIT_SSH_COMMAND="ssh -i ${key} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${known_hosts}"

          # Latest main rather than the triggering commit, so the push stays a fast-forward.
          git clone --quiet --depth 1 --branch main "git@github.com:${GITHUB_REPOSITORY}.git" repo
          cd repo
          banner="$(python3 scripts/update_banner.py --date "${DAY}")"
          if git diff --quiet -- README.md; then
            echo "README already up to date, nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "chore(banner): switch to ${banner}" -- README.md
          git push --quiet origin HEAD:main
